# perpdesk 反向代理。
#
# 页面上是真实持仓与账户数据，所以整站强制 Basic Auth —— 后端自身没有任何
# 鉴权，一旦绕过 nginx 直连 18090 就等于公开，因此后端只监听 127.0.0.1。
server {
    listen 80;
    server_name _;

    # 有域名时用 certbot 接管，会自动改写这一段
    access_log /var/log/nginx/perpdesk.access.log;
    error_log  /var/log/nginx/perpdesk.error.log;

    auth_basic "perpdesk";
    auth_basic_user_file /etc/nginx/perpdesk.htpasswd;

    # 前端静态产物
    root /opt/perpdesk/frontend/dist;
    index index.html;

    # 带指纹的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 行情推送：WebSocket 需要 Upgrade 头透传，且不能被读超时掐断
    location /api/market/ws {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 前端是 SPA，未知路径一律回 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
