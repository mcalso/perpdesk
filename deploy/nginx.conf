# perpdesk 反向代理。
#
# 鉴权在应用层做（scrypt 口令 + 服务端会话），不再叠 Basic Auth。
# 后端只监听 127.0.0.1：绕过 nginx 直连 18090 会拿不到 TLS，也拿不到
# X-Forwarded-Proto，cookie 的 Secure 判定会失效。
#
# ⚠️ listen 443 / ssl_* 那几行由 certbot 维护，改本文件时不要动它们。
server {
    listen 80;
    # 换成你自己的域名。certbot 要能在这里匹配到它才肯签证书。
    # 结尾的 _ 是兜底：用 IP 直接访问也会落到这个 block。
    server_name example.com _;

    access_log /var/log/nginx/perpdesk.access.log;
    error_log  /var/log/nginx/perpdesk.error.log;


    # 前端静态产物
    root /opt/perpdesk/frontend/dist;
    index index.html;

    # ---- 压缩 ----
    # ⚠️ 不要以为发行版已经替你开好了。Ubuntu 自带的 nginx.conf 里 `gzip on`
    # 确实是开的，但 gzip_types 整行是注释掉的 —— nginx 默认只压 text/html，
    # 于是 JSON 和 JS 全都原样发出去。实测（本项目部署机，1 Mbps）：
    #     JS 主包      232 KB 送出，压完只要 76 KB
    #     行情快照     147 KB / 30s 一刷 = 39 kbps，比整条 WebSocket 推送
    #                  还大一个量级
    #     首次打开     ~876 KB ≈ 14 秒 → 压后 ~255 KB ≈ 4 秒
    # 自托管常见的是小带宽 VPS，这几行的收益比任何应用层优化都大。
    gzip on;
    gzip_vary on;
    # 默认值是 off，不加这行，经 proxy_pass 回来的 /api 响应一律不压 ——
    # 而那恰恰是最大的一块。
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;      # 再小的响应，压缩开销不值当
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        text/plain
        image/svg+xml;
    # text/html 不用写，nginx 永远压它。
    #
    # 关于 BREACH：HTTPS 下压缩响应体，只有当响应里含有随请求变化的机密
    # （典型是回显在页面里的 CSRF token）时才可被利用。本项目的会话是
    # HttpOnly cookie，从不出现在响应体里，API 返回的是行情与持仓数据，
    # 所以开压缩是安全的。

    # 带指纹的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 行情推送：WebSocket 需要 Upgrade 头透传，且不能被读超时掐断
    location /api/market/ws {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 前端是 SPA，未知路径一律回 index.html 交给前端路由。
    # index.html 必须不缓存：它引用的是带 hash 的 JS 文件名，一旦被浏览器缓存，
    # 前端发新版后用户仍会加载旧 JS，表现为「改了但页面没变，要手动强刷」。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }


}

# ---------------------------------------------------------------------------
# 上 HTTPS
#
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d 你的域名 --agree-tos --redirect
#
# certbot 会往上面的 server 块里插 listen 443 / ssl_*，另外生成一个 80 端口的
# 块把请求 301 到 HTTPS，并装好自动续期的 systemd timer。带 "managed by
# Certbot" 注释的行不要手工改。
#
# 建议把 certbot 生成的那个 80 端口块里的 `return 404;` 换成：
#
#   location /.well-known/acme-challenge/ { root /var/www/html; }
#   location / { return 301 https://你的域名$request_uri; }
#
# 否则用 IP 或别的 Host 访问会直接 404，老书签全断。第一行留给 ACME 续期挑战，
# 不留会被重定向吃掉。
#
# ⚠️ 没有 HTTPS 时后端会拒绝通过网页写入 API 凭据（返回 421），站点口令也是
#    明文过网线的。详见 docs/SECURITY.md。
# ---------------------------------------------------------------------------
